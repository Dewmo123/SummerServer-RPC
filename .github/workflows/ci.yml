name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Verify Phase 0 constraints
        shell: pwsh
        run: |
          $productionProjects = @(Get-ChildItem -Path src -Filter *.csproj -Recurse)
          if ($productionProjects.Count -ne 1) {
            throw "Expected one production project, found $($productionProjects.Count)."
          }

          $dependencies = dotnet list SummerProject.slnx package --include-transitive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect package dependencies."
          }

          $forbiddenDependencies = @($dependencies | Select-String -Pattern 'EntityFrameworkCore|MySql|Newtonsoft\.Json')
          if ($forbiddenDependencies.Count -ne 0) {
            throw "A forbidden dependency is present: $($forbiddenDependencies -join ', ')"
          }

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
